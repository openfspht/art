name: Release

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: read

jobs:
  assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          name="openfsp-art-${TAG#v}"
          git archive --format=zip --prefix="${name}/" -o "${name}.zip" HEAD logo png BRAND.md LICENSE NOTICE README.md
          gh release upload "$TAG" "${name}.zip" --repo "$REPO" --clobber
